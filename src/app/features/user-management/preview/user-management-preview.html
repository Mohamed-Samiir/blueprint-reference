<div class="flex h-svh flex-col">
  <div
    class="bg-background text-foreground flex shrink-0 flex-wrap items-center gap-x-4 gap-y-2 border-b px-4 py-2 text-sm"
  >
    <span class="font-semibold">user-management-preview</span>

    <div class="ms-auto flex flex-wrap items-center gap-2">
      <button
        type="button"
        class="rounded-md border px-2.5 py-1 whitespace-nowrap hover:bg-accent"
        (click)="theme.toggleDark()"
      >
        mode: {{ theme.dark() ? 'dark' : 'light' }}
      </button>
      <button
        type="button"
        class="rounded-md border px-2.5 py-1 whitespace-nowrap hover:bg-accent"
        (click)="theme.toggleBrandX()"
      >
        palette: {{ theme.brandX() ? 'brand-x' : 'default' }}
      </button>
      <button
        type="button"
        class="rounded-md border px-2.5 py-1 whitespace-nowrap hover:bg-accent"
        (click)="lang.toggle()"
      >
        dir: {{ lang.dir() === 'rtl' ? 'RTL' : 'LTR' }}
      </button>
    </div>
  </div>

  <div class="min-h-0 flex-1 overflow-auto">
    <router-outlet />
  </div>
</div>
